<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的第一个网页</title>
  <style>
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f7fb;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: 80px auto;
      padding: 40px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      color: #0078d4;
      font-size: 42px;
    }
    p {
      font-size: 18px;
      line-height: 1.8;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      background: #0078d4;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
    }
    .btn:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>您好，我的网站上线了！</h1>
    <p>欢迎访问岚兴机电设备有限公司的主页。</p>
    <p>网站开发中，有疑问请向我们发送邮件。</p>
    <a class="btn" href="mailto:NationFMCD@Gmail.com">联系我</a>
  </div>
</body>
</html>
